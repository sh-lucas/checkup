name: Build and Push Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and Push ARM64 Image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT }}
          oauth-secret: ${{ secrets.TAILSCALE_SECRET }}
          tags: tag:gh-runner

      - name: Route registry.sh-lucas.dev through Tailscale IP
        run: |
          echo "${{ secrets.TAILSCALE_REGISTRY_IP }} registry.sh-lucas.dev" | sudo tee -a /etc/hosts

      - name: Login to Registry
        run: |
          podman login registry.sh-lucas.dev \
            -u "${{ secrets.REGISTRY_USER }}" \
            -p "${{ secrets.REGISTRY_PASSWORD }}"

      - name: Generate Image Tag
        id: prep
        run: |
          DATE=$(date +'%Y.%m.%d')
          RUN_NUM=$(printf "%03d" "${{ github.run_number }}")
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="${DATE}--${RUN_NUM}--${COMMIT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build Image with Podman
        run: |
          podman build \
            -t registry.sh-lucas.dev/checkup:${{ steps.prep.outputs.tag }} \
            -t registry.sh-lucas.dev/checkup:latest \
            .

      - name: Push Image to Registry
        run: |
          podman push registry.sh-lucas.dev/checkup:${{ steps.prep.outputs.tag }}
          podman push registry.sh-lucas.dev/checkup:latest
