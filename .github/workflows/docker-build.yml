name: Build and Push Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and Push ARM64 Image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Image Tag
        id: prep
        run: |
          DATE=$(date +'%Y.%m.%d')
          RUN_NUM=$(printf "%03d" "${{ github.run_number }}")
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="${DATE}--${RUN_NUM}--${COMMIT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT }}
          oauth-secret: ${{ secrets.TAILSCALE_SECRET }}
          tags: tag:gh-runner

      - name: Route registry.sh-lucas.dev through Tailscale IP
        run: |
          echo "${{ secrets.TAILSCALE_REGISTRY_IP }} registry.sh-lucas.dev" | sudo tee -a /etc/hosts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image (and load to local docker daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            registry.sh-lucas.dev/checkup:${{ steps.prep.outputs.tag }}
            registry.sh-lucas.dev/checkup:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Registry on Host
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.sh-lucas.dev \
            -u "${{ secrets.REGISTRY_USER }}" \
            --password-stdin

      - name: Push Image from Host
        run: |
          docker push registry.sh-lucas.dev/checkup:${{ steps.prep.outputs.tag }}
          docker push registry.sh-lucas.dev/checkup:latest
