name: Build and Push Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and Push ARM64 Image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then CLOUDFLARED_ARCH="amd64"; else CLOUDFLARED_ARCH="arm64"; fi
          sudo curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${CLOUDFLARED_ARCH} -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Start Cloudflared Access Proxy
        run: |
          cloudflared access tcp --hostname registry.sh-lucas.dev --url localhost:5000 --id "${{ secrets.CF_REGISTRY_ID }}" --secret "${{ secrets.CF_REGISTRY_SECRET }}" &
          # Give it a moment to establish the proxy connection
          sleep 3

      - name: Login to Registry
        run: |
          podman login localhost:5000 \
            -u "${{ secrets.REGISTRY_USER }}" \
            -p "${{ secrets.REGISTRY_PASSWORD }}"

      - name: Build Image with Podman
        run: |
          podman build -t localhost:5000/checkup:latest .

      - name: Push Image to Registry
        run: |
          podman push localhost:5000/checkup:latest

